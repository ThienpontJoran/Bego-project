# Projectinstellingen: naam en welke pakketten de app gebruikt.
name: bego_netwerkkaart
description: "Bego Netwerkkaart"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

# Pakketten die de app gebruikt
dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2 # de kaart
  latlong2: ^0.10.1 # coördinaten (breedtegraad, lengtegraad)
  http: ^1.6.0
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0
  excel: ^4.0.6
  web: ^1.1.2

# Pakketten die je alleen nodig hebt tijdens het programmeren
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Afbeeldingen die in de app gebruikt worden (logo's van Bego).
  assets:
    - images/
