name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      # De CARTO-sleutel komt uit de GitHub-geheimen (Settings > Secrets > Actions),
      # niet uit de code. Zo staat ze niet in de publieke repo.
      - run: flutter build web --release --base-href /${{ github.event.repository.name }}/ --dart-define=CARTO_SLEUTEL=$CARTO_SLEUTEL
        env:
          CARTO_SLEUTEL: ${{ secrets.CARTO_SLEUTEL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
